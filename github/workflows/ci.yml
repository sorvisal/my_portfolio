name: visal-portfolio
on:
  push:
    branches:
      - main
      - develop


  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group:  portfolio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build